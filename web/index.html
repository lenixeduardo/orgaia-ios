<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Foteka">
  <meta name="description" content="Foteka: suas fotos, suas coleções. Organize imagens no iPhone com privacidade e armazenamento local.">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>Foteka — Suas coleções</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon-library" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="m7 12 3 3 7-7"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.5" fill="var(--surface)"/><circle cx="15" cy="17" r="2.5" fill="var(--surface)"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2m10-10h-2M4 12H2m17.1 7.1-1.5-1.5M6.4 6.4 4.9 4.9m14.2 0-1.5 1.5M6.4 17.6l-1.5 1.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="2.5" y="3" width="19" height="18" rx="3"/><circle cx="16.5" cy="8" r="1.6"/><path d="m5 17 5-5 3 3 3-3 5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3z"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6zM14 2v6h5M9 12h7m-7 4h7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 2v13m-5-5 5 5 5-5M4 18v3h16v-3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 11v6m4-6v6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 19h2"/></symbol>
  </svg>

  <input id="file-input" type="file" accept="image/*,.heic,.heif" multiple hidden aria-label="Selecionar imagens">
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="/" id="brand-link" aria-label="Foteka, ir para Galeria">
        <svg class="brand-mark" viewBox="0 0 54 54" role="img" aria-label="Foteka">
          <rect x="7" y="5" width="37" height="39" rx="11" fill="#25D4AA" transform="rotate(-14 25 23)"/>
          <rect x="10" y="8" width="37" height="39" rx="11" fill="#048B76" transform="rotate(-6 28 27)"/>
          <rect x="13" y="12" width="38" height="39" rx="11" fill="url(#mark-green)"/>
          <path d="m19 40 9-10 5 5 5-6 7 11" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="41" cy="23" r="3.1" fill="#fff"/>
          <defs><linearGradient id="mark-green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#009C89"/><stop offset="0.6" stop-color="#005750"/><stop offset="1" stop-color="#75D936"/></linearGradient></defs>
        </svg>
        <span>foteka<span class="brand-dot">.</span></span>
      </a>
      <button type="button" class="top-add" data-action="import" aria-label="Adicionar fotografias"><svg class="icon"><use href="#i-plus"/></svg></button>
    </header>
    <div class="shell">
      <aside class="sidebar" aria-label="Navegação principal">
        <div class="sidebar-note">MENU</div>
        <nav id="desktop-nav"></nav>
        <div class="sidebar-footer"><span class="online-dot"></span> Local no seu dispositivo<br><small>Suas imagens ficam neste navegador</small></div>
      </aside>
      <main class="main" id="main" aria-live="polite"><div class="loading-shell">Preparando sua biblioteca…</div></main>
    </div>
    <nav class="bottom-nav" id="mobile-nav" aria-label="Navegação principal"></nav>
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
  </div>
  <dialog id="photo-dialog" class="photo-dialog" aria-label="Detalhes da fotografia">
    <div id="dialog-content"></div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
