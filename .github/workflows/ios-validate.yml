name: Foteka — Swift core + iOS SDK validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-linux:
    name: Foundation & RuleEngine (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - name: SwiftPM unit tests (original production sources)
        run: swift test --package-path Validation/Core

  ios-simulator:
    name: Xcode 27 / iOS Simulator
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple SDK and simulator
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available
      - name: Install XcodeGen on macOS
        run: brew install xcodegen
      - name: Generate Foteka V2 app icon
        run: |
          python3 -m venv "$RUNNER_TEMP/foteka-venv"
          "$RUNNER_TEMP/foteka-venv/bin/python" -m pip install --quiet cairosvg
          "$RUNNER_TEMP/foteka-venv/bin/python" scripts/generate_brand_assets.py
      - name: Generate .xcodeproj
        run: xcodegen generate --spec project.yml
      - name: Build with the real iOS Simulator SDK
        run: |
          set -o pipefail
          xcodebuild -project OrgaIA.xcodeproj \
            -scheme OrgaIA -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Diagnose built Share Extension metadata
        run: |
          set -euo pipefail
          SHARE_PLIST=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path "*/Build/Products/Debug-iphonesimulator/OrgaIAShare.appex/Info.plist" \
            -type f -print -quit)
          if [ -z "$SHARE_PLIST" ]; then
            echo "::error::OrgaIAShare.appex/Info.plist not found"
            exit 1
          fi
          echo "Built extension Info.plist: $SHARE_PLIST"
          plutil -lint "$SHARE_PLIST"
          plutil -p "$SHARE_PLIST"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$SHARE_PLIST" | grep -Fx "com.apple.share-services"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$SHARE_PLIST" | grep -Fx "OrgaIAShare.ShareViewController"
          /usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$SHARE_PLIST" | grep -Fx "XPC!"
          echo "Share Extension metadata validated"
      - name: Run native XCTest on iPhone simulator
        run: |
          set -o pipefail
          xcodebuild -project OrgaIA.xcodeproj \
            -scheme OrgaIA -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/OrgaIA.xcresult" \
            test
      - name: Save test report (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orgaia-ios-xcresult
          path: ${{ runner.temp }}/OrgaIA.xcresult
          if-no-files-found: ignore

  brand-assets:
    name: Materialize approved Foteka V2 icon
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render the 1024px icon
        run: |
          python3 -m venv "$RUNNER_TEMP/foteka-venv"
          "$RUNNER_TEMP/foteka-venv/bin/python" -m pip install --quiet cairosvg
          "$RUNNER_TEMP/foteka-venv/bin/python" scripts/generate_brand_assets.py
      - name: Publish generated iOS assets only if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/Assets.xcassets/AppIcon.appiconset
          if git diff --cached --quiet; then
            echo "Icon assets already up to date"
          else
            git commit -m "assets: materialize Foteka V2 iOS app icon"
            git push origin HEAD:main
          fi
