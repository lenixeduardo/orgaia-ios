name: OrgaIA
options:
  bundleIdPrefix: br.com.orgaia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  OrgaIA:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.orgaia.gallery
        PRODUCT_NAME: OrgaIA
        CODE_SIGN_ENTITLEMENTS: App/OrgaIA.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Foteka
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Organizar suas fotos localmente com IA e criar álbuns sem alterar os originais."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Importar imagens compartilhadas para organizar em álbuns."
    dependencies:
      - target: OrgaIAShare
        embed: true
  OrgaIAShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared/Config.swift
      - path: Shared/InboxFileStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.orgaia.gallery.share
        PRODUCT_NAME: OrgaIAShare
        CODE_SIGN_ENTITLEMENTS: ShareExtension/OrgaIAShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        SKIP_INSTALL: YES
  OrgaIATests:
    type: bundle.unit-test
    hostApplication: OrgaIA
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OrgaIA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.orgaia.gallery.tests
        GENERATE_INFOPLIST_FILE: YES
