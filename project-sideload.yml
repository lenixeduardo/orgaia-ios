# Device-only build without Share Extension / App Groups, suitable for Apple-ID sideload testing.
# Preserve the bundle identifier to allow later migration to a fully signed build.
name: OrgaIAFree
options:
  bundleIdPrefix: br.com.orgaia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Manual
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  OrgaIA:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.orgaia.gallery
        PRODUCT_NAME: OrgaIA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOTEKA_FREE_SIDELOAD"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Foteka
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Organizar suas fotos localmente com IA e criar álbuns sem alterar os originais."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Importar imagens compartilhadas para organizar em álbuns."
